name: plan

on:
  pull_request:
    paths: ['modules/**', 'envs/**', 'provisioning/**', '.github/workflows/**']

permissions:
  id-token: write      # OIDC — no long-lived cloud credential in repo secrets
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }

      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.59.1 }

      - run: pip install checkov==3.2.477

      - name: tflint --init
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Static checks
        run: ./scripts/ci-checks.sh ${{ matrix.environment }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Plan
        id: plan
        run: |
          terraform -chdir=envs/${{ matrix.environment }} init
          terraform -chdir=envs/${{ matrix.environment }} plan -no-color -out=tfplan
